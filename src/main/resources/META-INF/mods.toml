modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''
Клиентская смысловая сортировка глифов внутри обычной и творческой книги заклинаний Ars Nouveau.
Категории отображаются текстовыми заголовками прямо на страницах; мод не добавляет кнопок и не меняет механику заклинаний.
'''

